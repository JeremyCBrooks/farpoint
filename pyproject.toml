[project]
name = "easm"
version = "0.1.0"
description = "Passive external attack surface mapping from free/cheap OSINT sources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.6",
    "dnstwist>=20240812",
    "httpx>=0.27",
]

[project.scripts]
easm = "easm.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: hits the real internet (run with: uv run pytest -m network)"]
